server:
  port: 8050
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/product
    username: postgres
    password: postgres
    jpa:
      hibernate:
        ddl-auto: validate
      database: postgresql
      database-platform: org.hibernate.dialect.PostgreSQLDialect
    flyway:
      enabled: true
      baseline-on-migrate: true
      baseline-version: 0
      baseline-description: "init"
      user: postgres
      password: postgres